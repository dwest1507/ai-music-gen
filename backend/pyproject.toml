[project]
name = "backend"
version = "0.10.0" # x-release-please-version
description = "AI Music Generation backend — stateless proxy to ACE-Step Modal API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bandit>=1.9.4",
    "fastapi>=0.135.1",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "ruff>=0.16.5",
    "slowapi>=0.1.9",
    "uvicorn>=0.41.0",
]

[tool.ruff.lint]
# Ruff 0.16 expanded its default rule set from 59 to 413 rules; pin to the
# previous defaults so upgrading ruff doesn't silently change lint results.
select = ["E4", "E7", "E9", "F"]
