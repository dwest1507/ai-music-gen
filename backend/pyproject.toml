[project]
name = "backend"
version = "0.12.2" # x-release-please-version
description = "AI Music Generation backend — stateless proxy to ACE-Step Modal API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bandit>=1.9.4",
    "fastapi>=0.162.0",
    "groq>=0.18.0",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.22",
    "ruff>=0.17.3",
    "slowapi>=0.1.9",
    "uvicorn>=0.54.0",
]

[tool.ruff.lint]
# Ruff 0.16 expanded its default rule set from 59 to 413 rules; pin to the
# previous defaults so upgrading ruff doesn't silently change lint results.
select = ["E4", "E7", "E9", "F"]
